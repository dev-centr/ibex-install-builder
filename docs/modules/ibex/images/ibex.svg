<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Ibex">
  <!-- Geometric ibex mark: curved horns + head silhouette (stone gray). -->
  <g fill="#3D3A36" fill-rule="evenodd">
    <!-- Left horn -->
    <path d="M42 58c-2-18 6-36 18-48 1 14-2 28-8 40-3 6-7 10-10 8z"/>
    <!-- Right horn -->
    <path d="M70 52c8-16 22-28 38-34-10 12-16 26-18 40-1 8-8 12-14 8-4-3-6-8-6-14z"/>
    <!-- Head / neck -->
    <path d="M38 62c8-6 22-8 34-2 6 3 10 10 10 18 0 14-10 28-28 34-12 4-22 0-28-10-4-8-2-22 4-30 2-4 5-7 8-10z"/>
    <!-- Ear -->
    <path d="M48 70c4-2 8 0 10 4 1 3-1 6-4 7-4 1-8-2-8-6 0-2 1-4 2-5z"/>
    <!-- Eye (cutout via overlapping lighter? keep solid  small notch) -->
    <circle cx="56" cy="78" r="3" fill="#F5F2EC"/>
  </g>
</svg>
